[package]
name = "iced"
description = "A cross-platform GUI library inspired by Elm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "x11", "wayland", "android-native-activity", "mobile-logger", "mobile-fira-sans", "mobile-system-fonts"]
# Enables the `wgpu` GPU-accelerated renderer with all its default features (Vulkan, Metal, DX12, OpenGL, and WebGPU)
wgpu = ["wgpu-bare", "iced_renderer/wgpu"]
# Enables the `wgpu` GPU-accelerated renderer with the minimum required features (no backends!)
wgpu-bare = ["iced_renderer/wgpu-bare", "iced_widget/wgpu"]
# Enables the `tiny-skia` software renderer
tiny-skia = ["iced_renderer/tiny-skia"]
# Enables the `image` widget
image = ["image-without-codecs", "image/default"]
# Enables the `image` widget, without any built-in codecs of the `image` crate
image-without-codecs = ["iced_widget/image", "dep:image"]
# Enables the `svg` widget
svg = ["iced_widget/svg"]
# Enables the `canvas` widget
canvas = ["iced_widget/canvas"]
# Enables the `qr_code` widget
qr_code = ["iced_widget/qr_code"]
# Enables the `markdown` widget
markdown = ["iced_widget/markdown"]
# Enables lazy widgets
lazy = ["iced_widget/lazy"]
# Enables debug metrics in native platforms (press F12)
debug = ["iced_winit/debug", "dep:iced_devtools"]
# Enables time-travel debugging (very experimental!)
time-travel = ["debug", "iced_devtools/time-travel"]
# Enables hot reloading (very experimental!)
hot = ["debug", "iced_debug/hot"]
# Enables the tester developer tool for recording and playing tests (press F12)
tester = ["dep:iced_tester"]
# Enables the `thread-pool` futures executor as the `executor::Default` on native platforms
thread-pool = ["iced_futures/thread-pool"]
# Enables `tokio` as the `executor::Default` on native platforms
tokio = ["iced_futures/tokio"]
# Enables `smol` as the `executor::Default` on native platforms
smol = ["iced_futures/smol"]
# Enables querying system information
sysinfo = ["iced_winit/sysinfo"]
# Enables broken "sRGB linear" blending to reproduce color management of the Web
web-colors = ["iced_renderer/web-colors"]
# Enables pixel snapping for crisp edges by default (can cause jitter!)
crisp = ["iced_core/crisp", "iced_widget/crisp"]
# Enables the WebGL backend
webgl = ["iced_renderer/webgl"]
# Enables syntax highlighting
highlighter = ["iced_highlighter", "iced_widget/highlighter"]
# Enables the `widget::selector` module
selector = ["iced_runtime/selector"]
# Enables the advanced module
advanced = ["iced_core/advanced", "iced_widget/advanced"]
# Embeds Fira Sans into the final application; useful for testing and Wasm builds
fira-sans = ["iced_renderer/fira-sans"]
# Enables basic text shaping by default
basic-shaping = ["iced_core/basic-shaping"]
# Enables advanced text shaping by default
advanced-shaping = ["iced_core/advanced-shaping"]
# Enables strict assertions for debugging purposes at the expense of performance
strict-assertions = ["iced_renderer/strict-assertions"]
# Redraws on every runtime event, and not only when a widget requests it
unconditional-rendering = ["iced_winit/unconditional-rendering"]
# Enables support for the `sipper` library
sipper = ["iced_runtime/sipper"]
# Enables Linux system theme detection
linux-theme-detection = ["iced_winit/linux-theme-detection"]
# Enables the Unix X11 backend
x11 = ["iced_renderer/x11", "iced_winit/x11"]
# Enables the Unix Wayland backend
wayland = ["iced_renderer/wayland", "iced_winit/wayland"]
# The four mobile features below (`android-native-activity`, `mobile-logger`,
# `mobile-fira-sans`, `mobile-system-fonts`) are in `default`. All but
# `mobile-logger` do nothing on other targets; with it, `mobile::init_logger`
# installs a logger on the desktop (stderr) and the web (the console) too, so
# an application's own logger must be installed before it. With
# `default-features = false` they are all gone: list the ones the application
# needs (see the `iced::mobile` docs).
#
# Runs on Android in `android.app.NativeActivity`, which needs no Java code.
# Inert on other targets. An Android build needs exactly one of the two
# activity features; with neither, it fails inside android-activity with
# `error[E0583]: file not found for module `activity_impl`` and `Either
# "game-activity" or "native-activity" must be enabled as features`, which
# never name iced.
android-native-activity = ["iced_winit/android-native-activity"]
# Runs on Android in a GameActivity instead. It needs the androidx GameActivity
# classes in the APK (a Gradle build), and the NDK even for `cargo check`.
# android-activity refuses to build with both activity features, and Cargo
# turns a feature on for the whole build when any dependent asks for it. So
# set `default-features = false` on `iced` in EVERY crate of the dependency
# graph that depends on it (yours and third-party widget crates alike), and
# list `mobile-logger` and the font features again, or the default
# `android-native-activity` comes back and the build fails with "cannot be
# enabled at the same time". A graph with any crate on iced's defaults (a
# widget crate, or a crates.io dependent under [patch.crates-io]) cannot use
# GameActivity.
android-game-activity = ["iced_winit/android-game-activity"]
# Lets `mobile::init_logger` install a logger: logcat on Android, the unified
# log (os_log) on iOS, stderr on the desktop and the browser's console on the
# web. Adds no crate on the desktop, and only `web-sys`, which iced already
# depends on, on the web. Without it, `init_logger` installs only its panic
# hook, and iced's `log` output, panics included, goes nowhere unless the
# application installs a logger itself.
mobile-logger = ["dep:android_logger", "dep:oslog", "dep:web-sys"]
# Android and iOS: embeds Fira Sans and makes it the default font there, as
# `fira-sans` does on the web. It is licensed under the SIL Open Font License
# 1.1, so an application that ships it must ship `graphics/fonts/OFL.txt`.
# Without it, the default `SansSerif` family is the system's sans-serif font
# (Roboto, Helvetica Neue) when `mobile-system-fonts` is on, and nothing at
# all otherwise: set a `default_font` the application embeds. Embeds nothing
# on other targets.
mobile-fira-sans = ["iced_renderer/mobile-fira-sans"]
# Android and iOS: indexes the operating system's fonts (/system/fonts,
# /System/Library/Fonts) once, and gives the text stack fallback lists for
# them, so text in scripts the embedded fonts lack (CJK, Arabic, Hebrew,
# Indic, Thai, ...) is drawn, and so are serif and monospaced text. Leave it
# off when every font the application draws with is embedded and nothing may
# fall back to a system font. No effect on other targets.
mobile-system-fonts = ["iced_renderer/mobile-system-fonts"]
# Reserved for the debug-only agent bridge that the `icm` tool drives (an
# application's `icm-agent = ["iced/agent"]` feature turns it on in dev
# builds). It does nothing yet: it exists so that applications can declare
# that feature today.
agent = []

[dependencies]
iced_debug.workspace = true
iced_core.workspace = true
iced_futures.workspace = true
iced_renderer.workspace = true
iced_runtime.workspace = true
iced_widget.workspace = true
iced_winit.workspace = true

iced_devtools.workspace = true
iced_devtools.optional = true

iced_tester.workspace = true
iced_tester.optional = true

iced_highlighter.workspace = true
iced_highlighter.optional = true

log.workspace = true
thiserror.workspace = true

image.workspace = true
image.optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys.workspace = true
web-sys.optional = true
web-sys.features = ["console", "Location", "Window"]

[target.'cfg(target_os = "android")'.dependencies]
android_logger.workspace = true
android_logger.optional = true

[target.'cfg(target_os = "ios")'.dependencies]
oslog.workspace = true
oslog.optional = true

[dev-dependencies]
criterion = "0.5"
iced_wgpu.workspace = true

[[bench]]
name = "wgpu"
harness = false
required-features = ["canvas"]

[profile.release-opt]
inherits = "release"
codegen-units = 1
debug = false
lto = true
incremental = false
opt-level = 3
overflow-checks = false
strip = "debuginfo"

[workspace]
members = [
    "beacon",
    "core",
    "debug",
    "devtools",
    "futures",
    "graphics",
    "highlighter",
    "program",
    "renderer",
    "runtime",
    "selector",
    "test",
    "tester",
    "tiny_skia",
    "wgpu",
    "widget",
    "winit",
    "examples/*",
]
# The icm CLI is its own workspace with its own Cargo.lock, so its
# dependencies never enter the framework's lock.
exclude = ["cli"]

[workspace.package]
version = "0.14.1"
authors = ["Héctor Ramón Jiménez <hector@hecrj.dev>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/patricksmithlaravel/iced_mobile"
homepage = "https://iced.rs"
categories = ["gui"]
keywords = ["gui", "ui", "graphics", "interface", "widgets"]
rust-version = "1.88"

[workspace.dependencies]
iced = { version = "0.14.0", path = "." }
iced_beacon = { version = "0.14.0", path = "beacon" }
iced_core = { version = "0.14.0", path = "core" }
iced_debug = { version = "0.14.0", path = "debug" }
iced_devtools = { version = "0.14.0", path = "devtools" }
iced_futures = { version = "0.14.0", path = "futures" }
iced_graphics = { version = "0.14.0", path = "graphics" }
iced_highlighter = { version = "0.14.0", path = "highlighter" }
iced_program = { version = "0.14.0", path = "program" }
iced_renderer = { version = "0.14.0", path = "renderer" }
iced_runtime = { version = "0.14.0", path = "runtime" }
iced_selector = { version = "0.14.0", path = "selector" }
iced_test = { version = "0.14.0", path = "test" }
iced_tester = { version = "0.14.0", path = "tester" }
iced_tiny_skia = { version = "0.14.0", path = "tiny_skia", default-features = false }
iced_wgpu = { version = "0.14.0", path = "wgpu", default-features = false }
iced_widget = { version = "0.14.0", path = "widget" }
iced_winit = { version = "0.14.0", path = "winit", default-features = false }

android_logger = { version = "0.15.1", default-features = false }
bincode = "1.3"
bitflags = "2.0"
block2 = "0.5.1"
bytemuck = { version = "1.0", features = ["derive"] }
bytes = "1.6"
cargo-hot = { version = "0.1", package = "cargo-hot-protocol" }
cosmic-text = "0.15"
cryoglyph = "0.1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
glam = "0.25"
guillotiere = "0.6"
half = "2.2"
image = { version = "0.25", default-features = false }
kamadak-exif = "0.6"
kurbo = "0.10"
lilt = "0.8"
log = "0.4"
lyon = "1.0"
lyon_path = "1.0"
mundy = { version = "0.2", default-features = false }
nom = "8"
num-traits = "0.2"
objc2 = "0.5.2"
objc2-foundation = "0.2.2"
objc2-ui-kit = "0.2.2"
oslog = "0.2"
ouroboros = "0.18"
png = "0.18"
pulldown-cmark = "0.12"
qrcode = { version = "0.13", default-features = false }
raw-window-handle = "0.6"
resvg = "0.45"
rfd = "0.16"
rustc-hash = "2.0"
semver = "1.0"
serde = "1.0"
sha2 = "0.10"
sipper = "0.1"
smol = "2"
smol_str = "0.2"
softbuffer = { version = "0.4.7", default-features = false }
sysinfo = "0.33"
thiserror = "2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
tokio = "1.0"
tracing = "0.1"
two-face = { version = "0.4", default-features = false, features = ["syntect-default-fancy"] }
unicode-segmentation = "1.0"
url = "2.5"
wasm-bindgen-futures = "0.4"
wasmtimer = "0.4.2"
web-sys = "0.3.69"
web-time = "1.1"
wgpu = { version = "27.0", default-features = false, features = ["std", "wgsl"] }
window_clipboard = { version = "0.5", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
missing_docs = "deny"
unsafe_code = "deny"
unused_results = "deny"

[workspace.lints.clippy]
type-complexity = "allow"
map-entry = "allow"
large-enum-variant = "allow"
result_large_err = "allow"
semicolon_if_nothing_returned = "deny"
trivially-copy-pass-by-ref = "deny"
default_trait_access = "deny"
match-wildcard-for-single-variants = "deny"
redundant-closure-for-method-calls = "deny"
filter_map_next = "deny"
manual_let_else = "deny"
unused_async = "deny"
from_over_into = "deny"
needless_borrow = "deny"
new_without_default = "deny"
useless_conversion = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "forbid"
