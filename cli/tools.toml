# The external tools icm downloads itself (design §16.2), each pinned by
# version, URL and sha256 for every host it runs on. icm embeds this file;
# `icm print tools` shows what is installed.
#
# icm fetches a tool only with --yes (`icm doctor <platform> --fix --yes`, or
# `icm release <target> --yes`), never with --offline, with curl into
# <cache>/tools/<name>/<version>/ (`~/Library/Caches/icm` on macOS), and
# checks the download's size and sha256 before it unpacks anything.
# ICM_TOOL_<NAME> (e.g. ICM_TOOL_WASM_OPT) points icm at another copy, and
# ICM_TOOLS_TOML at another table (a mirror; icm's tests).
#
# kind: "file" (the download is the tool) or "tar.gz" (unpacked; `exe` is the
# path inside). `executable`: the file is made executable. `hosts` keys are
# Rust host triples, or "any". `doctor` is the `icm doctor` platform that
# installs the tool; `needed_by` the release targets that run it.
schema = 1

[[tool]]
name = "bundletool"
version = "1.18.3"
description = "Google's Android App Bundle tool (a Java jar: build-bundle, validate, dump, build-apks)"
doctor = "android"
needed_by = ["android"]
kind = "file"
exe = "bundletool-all-1.18.3.jar"
executable = false

[tool.hosts.any]
url = "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar"
sha256 = "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
bytes = 32520401

