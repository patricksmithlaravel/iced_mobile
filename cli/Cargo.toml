[package]
name = "icm"
# One tag, v0.14.1-mobile.N, releases the framework and icm together; this
# version must equal that tag without its leading "v".
version = "0.14.1-mobile.1"
description = "The iced_mobile app tool: check, build, run, see and test iced apps on desktop, web, iOS and Android"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "icm"
path = "src/lib.rs"

[[bin]]
name = "icm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
libc = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
tempfile = "3"

# Its own workspace: the CLI's dependencies stay out of the framework's lock.
[workspace]

[profile.release]
lto = "thin"
codegen-units = 4
