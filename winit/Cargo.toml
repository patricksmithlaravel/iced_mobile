[package]
name = "iced_winit"
description = "A runtime for iced on top of winit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = ["x11", "wayland"]
debug = ["iced_debug/enable"]
sysinfo = ["dep:sysinfo"]
unconditional-rendering = []
linux-theme-detection = ["dep:mundy", "mundy/async-io", "mundy/color-scheme"]
x11 = ["winit/x11", "window_clipboard/x11"]
wayland = ["winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita", "window_clipboard/wayland"]
# Android: run in `android.app.NativeActivity` (winit's `android-native-activity`).
# Exactly one of the two activity features must be on in an Android build:
# android-activity refuses to compile with neither or both. Inert on other targets.
android-native-activity = ["winit/android-native-activity"]
# Android: run in a GameActivity (winit's `android-game-activity`). It needs
# the androidx GameActivity classes in the APK, so a Gradle build, and its
# C++ glue is compiled by `cc`, so even `cargo check` needs the NDK. Cannot be
# combined with `android-native-activity`, which `iced`'s default features turn
# on: every crate in the graph that depends on `iced` must then set
# `default-features = false` (Cargo unifies features). Inert on other targets.
android-game-activity = ["winit/android-game-activity"]

[dependencies]
iced_debug.workspace = true
iced_program.workspace = true

log.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
tracing.workspace = true
window_clipboard.workspace = true
winit.workspace = true

sysinfo.workspace = true
sysinfo.optional = true

[target.'cfg(target_os = "ios")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-foundation.features = ["NSBundle", "NSDictionary", "NSNotification", "NSOperation", "NSString", "NSThread", "block2"]
objc2-ui-kit.workspace = true
objc2-ui-kit.features = ["UIResponder", "UIScene", "UISceneDefinitions", "UISceneSession", "UIView", "UIWindow", "UIWindowScene"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys.workspace = true
web-sys.features = ["Document", "Window", "HtmlCanvasElement"]
wasm-bindgen-futures.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
mundy.workspace = true
mundy.optional = true
